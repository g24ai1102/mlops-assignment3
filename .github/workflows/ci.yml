name: CI Pipeline

on:
  push:
    branches:
      - docker_ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run training script
        run: python src/train.py

      - name: Build Docker image
        run: docker build -t mlops-predict .

      - name: Run Docker container
        run: docker run mlops-predict

      - name: Log in to DockerHub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Push image to DockerHub
        run: |
          docker tag mlops-predict ${{ secrets.DOCKERHUB_USERNAME }}/mlops-predict:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-predict:latest
